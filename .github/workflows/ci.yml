name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: bazel ${{ matrix.bazel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["8.6.0", "9.2.0"]
    env:
      # Takes precedence over .bazelversion, so one checkout covers both majors.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Keyed by Bazel version: the two majors must not share an output cache.
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true
          # Pull requests RESTORE caches but never SAVE them: only reviewed code
          # should populate a cache a later trusted build consumes. Gated on the
          # ref rather than the event, because workflow_dispatch can target any
          # branch.
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Formatting and version consistency are test targets, so this covers them.
      - name: bazel test //...
        run: bazel test //...

      # Not covered by the line above: `bazel test` builds test targets and what
      # they need, and nothing needs the published artifact. Building it here is
      # what makes a malformed pom a pull-request failure rather than something
      # discovered while cutting a release.
      - name: the Clojars artifact builds
        run: bazel build //src:clojars

  # The path a Clojars consumer actually takes: plain clj, no Bazel. The
  # byte-identity suite needs Bazel-built protoc reference classes and is
  # excluded here by the :test alias's patterns; everything else runs.
  clj:
    name: plain clj
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: tests without Bazel
        run: clojure -X:test

  # The native-image story, kept honest: build the example server as a GraalVM
  # binary and round-trip the JVM client against it, every streaming shape.
  # .bazelversion's Bazel is enough — the matrix exists for the rules, not for
  # native-image.
  native:
    name: native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-native
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: build the native example server
        run: bazel build //examples:echo_native

      - name: JVM client against the native server, every streaming shape
        run: |
          PORT=18080 ./bazel-bin/examples/echo-server &
          for i in $(seq 1 50); do
            ss -ltn | grep -q 18080 && break
            sleep 0.2
          done
          bazel run //examples:client -- localhost:18080 | tee client.out
          kill %1
          grep -q 'say -> "echo: hello"' client.out
          grep -q 'repeat -> \["again #1" "again #2" "again #3"\]' client.out
          grep -q 'summarize -> {:message-count 3, :char-count 11}' client.out
          grep -q 'converse -> \["you said: ping" "you said: pong"\]' client.out

  # The single check branch protection requires. A required status check is
  # matched by check-run name, which for a matrix is the generated one; bump a
  # version in the matrix and a directly-required check never reports again,
  # blocking every pull request. Requiring one aggregate leaves the matrix free
  # to change. if: always() so it runs even when a leg fails — a skipped job
  # reports nothing, and a required check that never reports blocks instead of
  # failing.
  ci:
    name: ci
    needs: [bazel, clj, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job this depends on must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job reported '${result}'" >&2
              exit 1
            fi
          done
