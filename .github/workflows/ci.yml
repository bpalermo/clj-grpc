name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: bazel ${{ matrix.bazel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ["8.6.0", "9.2.0"]
    env:
      # Takes precedence over .bazelversion, so one checkout covers both majors.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # Keyed by Bazel version: the two majors must not share an output cache.
          disk-cache: ${{ github.workflow }}-${{ matrix.bazel }}
          repository-cache: true
          # Pull requests RESTORE caches but never SAVE them: only reviewed code
          # should populate a cache a later trusted build consumes. Gated on the
          # ref rather than the event, because workflow_dispatch can target any
          # branch.
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Formatting and version consistency are test targets, so this covers them.
      - name: bazel test //...
        run: bazel test //...

      # Not covered by the line above: `bazel test` builds test targets and what
      # they need, and nothing needs the published artifact. Building it here is
      # what makes a malformed pom a pull-request failure rather than something
      # discovered while cutting a release.
      - name: the Clojars artifact builds
        run: bazel build //src:clojars

  # The path a Clojars consumer actually takes: plain clj, no Bazel. The
  # byte-identity suite needs Bazel-built protoc reference classes and is
  # excluded here by the :test alias's patterns; everything else runs.
  clj:
    name: plain clj
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: tests without Bazel
        run: clojure -X:test

  # The native-image story, kept honest: build the example server as a GraalVM
  # binary and round-trip the JVM client against it, every streaming shape.
  # .bazelversion's Bazel is enough — the matrix exists for the rules, not for
  # native-image.
  native:
    name: native image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-native
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: build the native example server
        run: bazel build //examples:echo_native

      - name: JVM client against the native server, every streaming shape
        run: |
          PORT=18080 ./bazel-bin/examples/echo-server &
          for i in $(seq 1 50); do
            ss -ltn | grep -q 18080 && break
            sleep 0.2
          done
          bazel run //examples:client -- localhost:18080 | tee client.out
          kill %1
          grep -q 'say -> "echo: hello"' client.out
          grep -q 'repeat -> \["again #1" "again #2" "again #3"\]' client.out
          grep -q 'summarize -> {:message-count 3, :char-count 11}' client.out
          grep -q 'converse -> \["you said: ping" "you said: pong"\]' client.out

      # A shutdown hook the native image did not run would look, from the
      # outside, exactly like a killed server — so this watches the health
      # service through the drain. The transition to NOT_SERVING while the
      # watch is still open can only come from the hook flipping it before the
      # listener closes; a killed process ends the stream instead.
      - name: SIGTERM drains the native server instead of cutting it
        run: |
          set -o pipefail
          PORT=18081 ./bazel-bin/examples/echo-server &
          for i in $(seq 1 50); do
            ss -ltn | grep -q 18081 && break
            sleep 0.2
          done
          bazel run //examples:probe -- localhost:18081 > probe.out 2>&1 &
          for i in $(seq 1 100); do
            grep -q 'health -> SERVING' probe.out && break
            sleep 0.2
          done
          grep -q 'health -> SERVING' probe.out
          kill -TERM %1
          wait %2
          wait %1 || status=$?
          cat probe.out
          grep -q 'health -> NOT_SERVING' probe.out
          # 143 is SIGTERM's exit status whether or not hooks ran; the
          # NOT_SERVING line above is what proves they did.
          [ "${status:-0}" = "143" ] || { echo "server exit ${status:-0}, expected 143" >&2; exit 1; }

  # Both lockfiles, which nothing else checks. A stale lockfile does not fail a
  # build — it changes what the build resolves, quietly — so neither of these is
  # caught by `bazel test //...` passing.
  lockfiles:
    name: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lockfiles
          repository-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      # Bazel's default lockfile_mode is `update`: it rewrites MODULE.bazel.lock
      # in place and carries on, so CI regenerates it in memory and passes while
      # the committed file drifts. --config=strict-lockfile refuses instead. Run
      # on the .bazelversion pin only — the lockfile format is version-specific,
      # so the other matrix leg would report a difference that means nothing.
      - name: MODULE.bazel.lock is up to date
        run: bazel build --config=strict-lockfile //src:clj_grpc

      # deps.lock.json is what Bazel resolves the classpath from, while the
      # published pom is generated from deps.edn (clj_maven_export's deps_edn).
      # So a deps.edn edit without a regenerated lock builds and tests against
      # the OLD jars and ships a pom naming the new ones — green CI, wrong
      # release. The netty alignment test catches that one case; this catches
      # the general one.
      #
      # The lock tool's own deps are a dev dependency of rules_clj, so it cannot
      # run from this repo; clone rules_clj at the version MODULE.bazel pins,
      # read from MODULE.bazel so this check cannot drift from the module graph.
      #
      # --aliases must list every alias whose :extra-deps belong in the lock.
      # Adding one to deps.edn means adding it here, or this check passes while
      # the lock is missing its jars.
      - name: deps.lock.json matches deps.edn
        run: |
          set -o pipefail
          version=$(awk -F'"' '/bazel_dep\(name = "rules_clj"/ { print $4; exit }' MODULE.bazel)
          echo "rules_clj ${version}, per MODULE.bazel"
          git clone --depth 1 --branch "v${version}" \
            https://github.com/bpalermo/rules_clj /tmp/rules_clj
          (cd /tmp/rules_clj && bazel run //tools/lock -- \
            --deps-edn="${GITHUB_WORKSPACE}/deps.edn" \
            --output=/tmp/deps.lock.json \
            --aliases=bench,async-example)
          if ! diff -u deps.lock.json /tmp/deps.lock.json; then
            echo "::error::deps.lock.json does not match deps.edn. Regenerate it:" \
                 "from a rules_clj ${version} checkout, bazel run //tools/lock --" \
                 "--deps-edn=<abs>/deps.edn --output=<abs>/deps.lock.json" \
                 "--aliases=bench,async-example" >&2
            exit 1
          fi
          echo "deps.lock.json is current"

  # The single check branch protection requires. A required status check is
  # matched by check-run name, which for a matrix is the generated one; bump a
  # version in the matrix and a directly-required check never reports again,
  # blocking every pull request. Requiring one aggregate leaves the matrix free
  # to change. if: always() so it runs even when a leg fails — a skipped job
  # reports nothing, and a required check that never reports blocks instead of
  # failing.
  ci:
    name: ci
    needs: [bazel, clj, native, lockfiles]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every job this depends on must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::a required job reported '${result}'" >&2
              exit 1
            fi
          done
