# clj-grpc's native-image contract, auto-discovered from the jar.
#
# clj_grpc.impl holds the one namespace that references Netty (see
# clj-grpc.impl.netty); it is loaded via requiring-resolve at first
# construction and must initialize at run time, because its class initializers
# resolve Netty classes whose own metadata (correctly) forbids build-time
# initialization.
#
# io.grpc.netty is marked wholesale: grpc-netty ships no native-image metadata
# of its own (only grpc-netty-shaded does), and its class initializers probe
# Netty eagerly — NettyServerBuilder.<clinit> reaches Epoll.<clinit>, which
# loads the JNI library — exactly what Netty's own metadata forbids at build
# time. Same treatment Netty gives its io.netty.channel.epoll package.
# io.netty.handler.ssl for the same reason, a gap in Netty's own metadata:
# JdkSslServerContext.<clinit> parses a PEM to probe trust-manager wrapping,
# allocating ByteBufs — whose classes netty-buffer marks run-time.
Args = --initialize-at-run-time=clj_grpc.impl \
       --initialize-at-run-time=io.grpc.netty \
       --initialize-at-run-time=io.netty.handler.ssl
