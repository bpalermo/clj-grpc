# talos-main: 4-core arm64 workers. One arm per worker — three 1-CPU
# Guaranteed pods on one 4-core node would saturate it and measure the
# scheduler instead of the servers. The k6 runner (testrun.yaml) gets a
# fourth worker.
#
# Reproducibility: pin each image by the digest build.yaml printed for the
# run being soaked (replace the `latest` tags below). A rerun of the same
# overlay then tests byte-identical servers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/bpalermo/clj-grpc/soak-grpc-native
    digest: sha256:9c5615fc04e56727e4d641b8239c04aca9f413eed297e92b5862b987daa52d09 # 806a7aa
  - name: ghcr.io/bpalermo/clj-grpc/soak-grpc-jvm
    digest: sha256:15e2f806fc554a98cd963a9a1d5de7db122bc85234d688ff0ac542d4765087da # 806a7aa
  - name: ghcr.io/bpalermo/clj-grpc/soak-rest
    digest: sha256:b0bb559e6a383142998dbaa76ce457cc3cb96374438b940da0dbca39cf4dd631 # 806a7aa

patches:
  - target:
      kind: Deployment
      name: grpc-native
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/hostname: main-worker-02}
  - target:
      kind: Deployment
      name: grpc-jvm
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/hostname: main-worker-03}
  - target:
      kind: Deployment
      name: rest
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {kubernetes.io/hostname: main-worker-04}
