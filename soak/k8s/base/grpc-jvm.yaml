# The gRPC JVM arm: the identical greeter server as its deploy jar on the
# distroless JRE. JVM startup on small arm cores takes seconds — the probes
# allow for it; readiness gates traffic until the server actually answers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-jvm
  namespace: clj-grpc-soak
  labels:
    app: grpc-jvm
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-jvm
  template:
    metadata:
      labels:
        app: grpc-jvm
        app.kubernetes.io/part-of: clj-grpc-soak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/bpalermo/clj-grpc/soak-grpc-jvm:latest
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: h2c
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-jvm
  namespace: clj-grpc-soak
  labels:
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  selector:
    app: grpc-jvm
  ports:
    - name: h2c
      port: 8080
      targetPort: 8080
