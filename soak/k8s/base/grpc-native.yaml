# The gRPC native-image arm: //bench:coldstart_native in a container.
# Guaranteed QoS (requests == limits) so the comparison is a fixed budget —
# the 1-CPU/1Gi pod shape the README's density table measured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-native
  namespace: clj-grpc-soak
  labels:
    app: grpc-native
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-native
  template:
    metadata:
      labels:
        app: grpc-native
        app.kubernetes.io/part-of: clj-grpc-soak
    spec:
      containers:
        - name: server
          image: ghcr.io/bpalermo/clj-grpc/soak-grpc-native:latest
          env:
            - name: PORT
              value: "8080"
          ports:
            - name: h2c
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-native
  namespace: clj-grpc-soak
  labels:
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  selector:
    app: grpc-native
  ports:
    - name: h2c
      port: 8080
      targetPort: 8080
