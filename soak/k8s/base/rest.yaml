# The REST comparison arm: clj-grpc.soak.rest-server (Pedestal/Jetty,
# jsonista) with the same echo semantics, heap cap, and pod budget as the
# gRPC JVM arm — the only variable is the stack.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
  namespace: clj-grpc-soak
  labels:
    app: rest
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest
  template:
    metadata:
      labels:
        app: rest
        app.kubernetes.io/part-of: clj-grpc-soak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/bpalermo/clj-grpc/soak-rest:latest
          env:
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            # Saturation tolerance: capacity ramps starve probes on a pegged
            # 1-CPU pod; the kubelet killing a saturated-but-healthy server
            # mid-measurement was measured, not hypothesized.
            failureThreshold: 60
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rest
  namespace: clj-grpc-soak
  labels:
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  selector:
    app: rest
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
