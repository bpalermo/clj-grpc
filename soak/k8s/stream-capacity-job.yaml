# Streaming capacity driver — applied per run, NOT part of the kustomization.
# Runs the bidi-echo ramp (clj-grpc.soak.stream-driver, which ships inside
# the soak-grpc-jvm image's jar) against one gRPC arm; results are the Job's
# logs (`kubectl -n clj-grpc-soak logs job/stream-capacity`).
#
# Per run: pin the image digest to the current overlay pin, set TARGET_ADDR,
# and set the arm's executor via its Deployment env (EXECUTOR=direct or
# unset) before applying. Delete the Job between runs.
apiVersion: batch/v1
kind: Job
metadata:
  name: stream-capacity
  namespace: clj-grpc-soak
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: stream-capacity, app.kubernetes.io/part-of: clj-grpc-soak}
    spec:
      restartPolicy: Never
      # The driver on its own worker, like every load generator in this
      # namespace.
      nodeSelector: {kubernetes.io/hostname: main-worker-05}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: driver
          # Same digest as the overlay's soak-grpc-jvm pin.
          image: ghcr.io/bpalermo/clj-grpc/soak-grpc-jvm:latest
          command: ["/usr/bin/java", "-Xmx768m", "-cp", "/app.jar", "clojure.main", "-m", "clj-grpc.soak.stream-driver"]
          env:
            - name: TARGET_ADDR
              value: grpc-jvm.clj-grpc-soak.svc.cluster.local:8080
            - name: STREAMS
              value: "20"
            - name: RAMP
              value: "400 800 1200 1600 2000 2400 2800 3200 3600 4000 4400 4800"
            - name: STEP_SECONDS
              value: "120"
            - name: INFLIGHT
              value: "256"
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: "2", memory: 1Gi}
            limits: {cpu: "2", memory: 1Gi}
      volumes:
        - {name: tmp, emptyDir: {}}
