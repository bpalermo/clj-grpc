edition = "2024";

package acme.greeter;

option java_package = "com.acme.greeter";

// Edition 2024 defaults exercised here:
//   features.field_presence            = EXPLICIT       -> hasName() exists on a singular string
//   features.enum_type                 = OPEN           -> unknown enum numbers round-trip
//   features.enforce_naming_style      = STYLE2024      -> lower_snake fields, PascalCase messages
//   features.default_symbol_visibility = EXPORT_TOP_LEVEL
//   features.(pb.java).nest_in_file_class = NO          -> top-level com.acme.greeter.HelloRequest
// and the outer class defaults to GreeterProto (camel-cased filename + "Proto").

enum Greeting {
  GREETING_UNSPECIFIED = 0;
  GREETING_HELLO = 1;
  GREETING_HOWDY = 2;
}

// The switch ladder's "realistic" payload tier: a nested structure with
// strings, numbers and a repeated field, sized to roughly a kilobyte on the
// wire. The tiny tier leaves it absent, so its bytes are unchanged from the
// August campaign. Echoed back in the reply so both REST and gRPC pay the same
// decode+encode per request.
message Item {
  string sku = 1;
  int32 qty = 2;
  double price = 3;
}

message Payload {
  string id = 1;
  string title = 2;
  string body = 3;
  int64 created_at = 4;
  double score = 5;
  repeated Item items = 6;
}

message HelloRequest {
  string name = 1;
  int32 repeat_count = 2;
  Greeting greeting = 3;
  Payload payload = 4;
}

message HelloReply {
  string message = 1;
  Payload payload = 2;
}

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc SayHelloMany(HelloRequest) returns (stream HelloReply);
  rpc CollectHellos(stream HelloRequest) returns (HelloReply);
  rpc Chat(stream HelloRequest) returns (stream HelloReply);
}
