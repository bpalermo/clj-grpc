# One template for every arm: the three servers are deliberately identical
# in shape — same budget, same probe posture, same security context — so the
# only differences a reader ever has to reason about are the values.
{{- range $name, $arm := .Values.arms }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: clj-grpc-soak
spec:
  {{- /* Not `default 1`: Helm's default treats 0 as empty, and 0 is the point. */}}
  replicas: {{ if hasKey $arm "replicas" }}{{ $arm.replicas }}{{ else }}1{{ end }}
  # Recreate, not RollingUpdate: every arm is pinned to one node by selector,
  # and that node has room for exactly one Guaranteed 1-CPU arm. A rolling
  # upgrade's surge pod needs a second such core on the same node, finds
  # none, and the rollout deadlocks Pending — which is how chart 0.2.2's
  # upgrade failed. Old pod out, then the new one in; a run restarts the arm
  # anyway, so the gap costs nothing the campaign measures.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: clj-grpc-soak
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ $arm.nodeSelector }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ $arm.image }}"
          {{- /* The Pyroscope Java agent attaches only when this arm is
               profiled AND profiling is on. Attaching is the whole cost: a
               JVMTI agent, even one whose profiler is idle, turns on the
               virtual-thread transition hooks (JvmtiThreadState per vthread,
               VTMS transition bookkeeping) on every mount and unmount, which
               taxes the VT executor and nothing else — so the images carry
               the jar but never load it; this env does. */}}
          {{- $agent := and $arm.profile $.Values.profiling.enabled }}
          {{- $javaToolOptionsSet := false }}
          env:
            - name: PORT
              value: "8080"
            {{- range $k, $v := ($arm.extraEnv | default dict) }}
            {{- if and $agent (eq $k "JAVA_TOOL_OPTIONS") }}
            {{- /* One variable, one entry: an A/B's own JVM flags and the
                 agent ride together rather than as two JAVA_TOOL_OPTIONS,
                 of which Kubernetes would keep only the last. */}}
            {{- $javaToolOptionsSet = true }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ printf "%s -javaagent:/pyroscope.jar" $v | quote }}
            {{- else }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if $agent }}
            {{- if not $javaToolOptionsSet }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/pyroscope.jar"
            {{- end }}
            # The application name is suffixed so these series never merge
            # with the eBPF profiler's, which labels the pod by Deployment name.
            - name: PYROSCOPE_SERVER_ADDRESS
              value: {{ $.Values.profiling.serverAddress | quote }}
            - name: PYROSCOPE_APPLICATION_NAME
              value: {{ printf "%s-java" $name | quote }}
            - name: PYROSCOPE_PROFILER_EVENT
              value: {{ $.Values.profiling.event | quote }}
            - name: PYROSCOPE_PROFILING_INTERVAL
              value: {{ $.Values.profiling.interval | quote }}
            - name: PYROSCOPE_UPLOAD_INTERVAL
              value: {{ $.Values.profiling.uploadInterval | quote }}
            - name: PYROSCOPE_LABELS
              value: {{ printf "arm=%s,namespace=%s,campaign=switch_ladder" $name $.Values.namespace | quote }}
            - name: PYROSCOPE_LOG_LEVEL
              value: "warn"
            {{- end }}
          ports:
            - name: {{ if eq $arm.probe "grpc" }}h2c{{ else }}http{{ end }}
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: {{ $.Values.resources.cpu | quote }}
              memory: {{ $.Values.resources.memory }}
            limits:
              cpu: {{ $.Values.resources.cpu | quote }}
              memory: {{ $.Values.resources.memory }}
          {{- if eq $arm.probe "grpc" }}
          readinessProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          startupProbe:
            grpc:
              port: 8080
            periodSeconds: 5
            failureThreshold: {{ $.Values.probes.startupFailureThreshold }}
          livenessProbe:
            grpc:
              port: 8080
            periodSeconds: 10
            failureThreshold: {{ $.Values.probes.livenessFailureThreshold }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: {{ $.Values.probes.startupFailureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: {{ $.Values.probes.livenessFailureThreshold }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
