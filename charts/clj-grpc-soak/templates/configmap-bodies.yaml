# The load generator's request bodies, generated by //charts:bodies from the
# proto in this tree (see clj-grpc.soak.payload). binaryData because the
# protobuf ones are bytes; SIZES.txt is text and goes into the results doc.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nh-bodies
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: clj-grpc-soak
binaryData:
  {{- range $tier := list "tiny" "realistic" "dense" }}
  {{- range $ext := list "json" "pb" }}
  {{ printf "%s.%s" $tier $ext }}: {{ $.Files.Get (printf "clj-grpc-soak/files/bodies/%s.%s" $tier $ext) | b64enc }}
  {{- end }}
  {{- end }}
data:
  SIZES.txt: |
{{ .Files.Get "clj-grpc-soak/files/bodies/SIZES.txt" | indent 4 }}
