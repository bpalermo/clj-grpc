# Per-run object, off by default — a run is an invocation, not standing
# state. Start one with:
#   bazel run //charts:soak.upgrade -- --set testRun.enabled=true
# and remove it by flipping the flag back.
{{- if .Values.testRun.enabled }}
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: clj-grpc-soak
  namespace: {{ .Values.namespace }}
spec:
  parallelism: 1
  arguments: -o experimental-opentelemetry
  script:
    configMap:
      name: k6-soak-script
      file: soak.js
  initializer:
    nodeSelector:
      kubernetes.io/hostname: {{ .Values.runner.nodeSelector }}
  starter:
    nodeSelector:
      kubernetes.io/hostname: {{ .Values.runner.nodeSelector }}
  runner:
    image: grafana/k6:latest
    nodeSelector:
      kubernetes.io/hostname: {{ .Values.runner.nodeSelector }}
    resources:
      requests:
        cpu: "2"
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 1Gi
    env:
      - name: RATE
        value: {{ .Values.testRun.rate | quote }}
      - name: DURATION
        value: {{ .Values.testRun.duration }}
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: {{ .Values.testRun.otelEndpoint }}
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
      - name: K6_OTEL_EXPORTER_TYPE
        value: grpc
      - name: K6_OTEL_METRIC_PREFIX
        value: k6_
      - name: K6_OTEL_SERVICE_NAME
        value: clj-grpc-soak
      - name: K6_OTEL_EXPORT_INTERVAL
        value: 5s
{{- end }}
