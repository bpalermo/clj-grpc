apiVersion: v2
name: clj-grpc-soak
description: >-
  The clj-grpc switch-ladder harness: echo-server arms (REST/Pedestal over
  HTTP/1.1 and over h2c, gRPC JVM, gRPC native-image) on identical resource
  budgets, the generated request bodies, and a per-run Nighthawk load Job.
  Image digests are stamped from the Bazel build graph at package time.
type: application
# Chart version: bumped by hand when the chart's shape changes. The app
# content is identified by appVersion (stamped with the git commit) and by
# the image digests inside values — charts are configuration, not
# per-commit artifacts.
version: 0.2.8
appVersion: "{STABLE_GIT_COMMIT}"
