# Image references are stamped at `bazel build //charts:soak` time by
# rules_helm's rules_img integration: each bracketed //bazel/images:*_push token
# becomes registry/repository@sha256:... of the image actually built —
# nothing is read from any registry, and there is no pin script to run.
namespace: clj-grpc-soak

# The switch ladder: each adjacent pair of arms changes exactly one thing —
#   rest-h1  → rest-h2c   transport        (same image, same node; only $H2C differs)
#   rest-h2c → grpc-jvm   protocol         (JSON/Jetty → protobuf/Netty)
#   grpc-jvm unary → grpc-jvm stream       interaction model (same arm, different Job mode)
# grpc-native is not a rung of the ladder — it exists for the density and
# cold-start story — and it is the one arm this chart does NOT pin. GraalVM's
# output is not reproducible, so pinning it made every graph-invalidating
# change rewrite the chart's render and force a version bump unrelated to the
# change; and native numbers are comparable only within one digest anyway
# (docs/results/2026-09-switch-ladder-raw.md), so pinning it in a shared chart
# implied a stability it never had. An arm with an empty image renders nothing
# at all — no Deployment, no Service. To run it, pass the digest you mean:
#
#   --set-string arms.grpc-native.image=ghcr.io/bpalermo/clj-grpc/soak-grpc-native@sha256:<digest>
#
# soak/ladder.sh takes it as NATIVE_IMAGE and refuses a grpc-native run
# without it. The digest of each build is in build.yaml's digest summary. `profile: true` marks the arms the Pyroscope Java agent
# is loaded into when profiling.enabled is set — loaded, not merely switched
# on: the JVM images ship the jar but never -javaagent it themselves, because
# an attached JVMTI agent taxes every virtual-thread mount and unmount even
# when its profiler is idle. The native image has no JVM.
arms:
  grpc-native:
    image: ""
    probe: grpc
    nodeSelector: main-worker-02
    profile: false
    jvm: false
  grpc-jvm:
    image: "{@//bazel/images:grpc_jvm_push}"
    probe: grpc
    nodeSelector: main-worker-03
    jvm: true
    profile: true
    # :direct won every high-load regime in August; the VT default is the
    # low-utilization tail-latency arm. Flip per experiment.
    extraEnv:
      EXECUTOR: direct
  # The typed-interop arm: the same server built from protoc-gen-clojure's
  # `interop=true` generated code instead of the descriptor-driven one, to
  # price that generator option on a service. Shares worker-02 with
  # grpc-native, which has room for one Guaranteed 1-CPU arm and not two, so
  # like the REST pair it starts scaled to zero and soak/ladder.sh flips the
  # pair per run. No EXECUTOR: the library default (virtual threads), which is
  # what grpc-jvm must also be set to for the comparison to have one variable.
  grpc-jvm-interop:
    image: "{@//bazel/images:grpc_jvm_interop_push}"
    probe: grpc
    nodeSelector: main-worker-02
    jvm: true
    profile: true
    replicas: 0
  rest-h1:
    image: "{@//bazel/images:rest_push}"
    probe: http
    nodeSelector: main-worker-04
    jvm: true
    profile: true
    extraEnv:
      H2C: "off"
  rest-h2c:
    image: "{@//bazel/images:rest_push}"
    probe: http
    nodeSelector: main-worker-04
    jvm: true
    profile: true
    # Shares worker-04 with rest-h1, and that node has room for one Guaranteed
    # 1-CPU arm, not two. Only one REST arm is up at a time: this one starts
    # scaled to zero and soak/ladder.sh flips the pair per run.
    replicas: 0
    extraEnv:
      H2C: "on"
      # Jetty's default is 128 concurrent streams per connection, which an
      # open-loop client exceeds at the top of a ramp — and a refused stream
      # is scored as an error, not as saturation. Must be >= the driver's
      # maxConcurrentStreams below.
      H2C_MAX_STREAMS: "1024"

# Identical budgets on every arm — the comparison IS the fixed budget.
resources:
  cpu: "1"
  memory: 1Gi

# Probe posture from the measured campaigns: JVM arms need minutes of
# startup grace (cold JIT under load), and a saturated 1-CPU pod starves its
# liveness probe — 10 minutes of tolerance keeps the kubelet from killing a
# healthy server mid-capacity-ramp.
probes:
  startupFailureThreshold: 36
  livenessFailureThreshold: 60

# Where load generators run (the Nighthawk Job / the stream cross-check).
runner:
  nodeSelector: main-worker-05

# Runtime direct linking: -Dclojure.compiler.direct-linking=true on the JVM
# arms. Measured on this harness (docs/results, 2026-09-08): unary 0.461 ->
# 0.437 ms/req at 1,000 and 0.283 -> 0.245 at 3,000; stream 0.315 -> 0.260
# ms/msg at 2,000; Var.getRawRoot 3.2% -> 1.12% of samples. It reaches what
# the build-time attribute cannot: clj-protobuf, Pedestal and jsonista all
# publish as source and are compiled by Clojure at load time in the image,
# and that is exactly the code this links.
#
# It is a SEMANTIC change, not only a speed one: the property is process-wide
# and applies to everything loaded from source, so a linked call site stops
# seeing later redefinition — with-redefs and REPL reloading do not take
# effect through one. Right for a server image, wrong for a REPL. Nothing in
# this repo redefines at runtime.
#
# A value rather than a baked entrypoint flag so a run can A/B it without
# rebuilding an image. The native arm is deliberately excluded: a native
# image has no Clojure compiler, nothing is compiled at load time in it, and
# the property would be a flag that does nothing.
directLinking:
  enabled: true

# JVM flags for every `jvm: true` arm, composed into JAVA_TOOL_OPTIONS ahead
# of direct linking and the agent. Default: a sized young generation. Under
# these pods' 1 Gi limit the JVM is not "server-class" and picks Serial GC
# with a young generation that starts at ~5 MB, so a streaming arm collects
# almost continuously; `-Xmn256m` measured +25–33% streamed messages on the
# virtual-thread executor and +70% on :direct with eight connections at
# 4 cores (soak/results/2026-09-12-local-vt-levers). The collector is second
# order: Serial with this young generation matches ParallelGC. Empty to run
# the JVM's own defaults. Since 0.2.23.
jvmOptions: "-Xmn256m"

# Inbound flow-control credits on the gRPC JVM arms (INBOUND_CREDITS → the
# server's :inbound-credits): ask the transport for this many messages at a
# time instead of grpc-java's one per delivered message. Measured +27–40%
# streamed messages per second on virtual threads at −23–35% CPU per message;
# the batch size does not matter above a handful. Empty to leave grpc-java's
# auto-request in place. Since 0.2.23.
inboundCredits: "8"

# Pyroscope's Java agent on the `profile: true` arms, attached through
# JAVA_TOOL_OPTIONS=-javaagent:/pyroscope.jar only when this is on; off, no
# arm carries any agent env at all. Off by default: the agent's own overhead
# is a variable the campaign measures explicitly (one with/without pair per
# arm) before any profiled table is trusted — and it is not zero even idle,
# see the arms comment above. If an arm's extraEnv also sets
# JAVA_TOOL_OPTIONS (an A/B's JVM flags), the template appends the agent to
# it rather than emitting the variable twice. The application name gets a
# -java suffix so these series never merge with the eBPF profiler's, which
# already labels the pod by its Deployment name.
profiling:
  enabled: false
  serverAddress: http://pyroscope.o11y.svc.cluster.local:4040
  event: itimer          # no perf_event_open needed under drop: [ALL]
  interval: 10ms
  uploadInterval: 10s

# One load run, off by default: a run is an invocation, not standing state.
# Enable via --set on a helm upgrade, delete by flipping back. The Job runs
# the stepped ramp for ONE arm × mode × tier; the whole ladder is a sequence
# of these (soak/ladder.sh).
loadJob:
  enabled: false
  # P0 image (arm64+amd64, curl, ENTRYPOINT nighthawk_client). :latest is not
  # tagged on the fork yet; pin the sha per campaign.
  image: ghcr.io/bpalermo/nighthawk:bc9de452fa39efd6d4ddd00c0b545cde275eddae
  target: rest-h1              # arm name == Service DNS name
  mode: http1                  # http1 | http2 | grpc-unary | grpc-stream
  tier: tiny                   # tiny | realistic → /bodies/<tier>.{json,pb}
  ramp: "200 400 600 800 1000 1200 1400 1600 1800 2000 2200 2400"
  stepSeconds: "110"
  warmup:
    rps: "200"
    seconds: "120"
  # The driver's budget, Guaranteed (requests == limits). One dedicated core
  # and ONE worker: the runner node (main-worker-05) now also hosts
  # pyroscope-0 and ~2 CPUs of other requests, so two Guaranteed cores no
  # longer fit — and one Nighthawk event loop spinning on its own core is what
  # the project's own precision guidance prefers over two contending ones. A
  # single worker sustains every rate on this ladder with room to spare.
  resources:
    cpu: "1"
    memory: 1Gi
  # Nighthawk event loops. --streams must divide by it. Every rate and
  # connection budget below is AGGREGATE; run.sh divides by this, because
  # Nighthawk's own flags are per worker. Raise it together with
  # resources.cpu — never above the cores the Job is Guaranteed.
  concurrency: "1"
  # spin gives the most precise send times but burns a full core per worker;
  # on a throttled driver it distorts timings — use sleep if the Job cannot
  # get resources.cpu Guaranteed.
  idleStrategy: spin
  # "yes" sends REST bodies with --request-body-file (the fork's P1, pinned
  # above). "no" is the P0 path through the in-line request-source plugin,
  # kept for reproducing Phase A, which ran on it.
  bodyViaFile: "yes"
  # HTTP/1.1: connections cap in-flight requests, so the knee must be the
  # server's, not the client's. HTTP/2: streams per connection × connections
  # must be >= maxActiveRequests or Nighthawk self-throttles, and streams per
  # connection must be <= the server's H2C_MAX_STREAMS.
  http1Connections: "256"
  http2Connections: "8"
  maxActiveRequests: "4096"
  maxConcurrentStreams: "512"
  stream:
    streams: "20"
    inflight: "256"
    drain: 0.5s  # protobuf Duration spelling; the fork rejects "500ms"
  # Appended to the Job name so two runs never collide; set per invocation.
  runId: ""

# The Clojure stream driver, kept ONLY as a cross-check for the grpc-stream
# arm: same streams/inflight, its own histogram — agreement with Nighthawk's
# per-message numbers is what lets the August tables stay comparable.
streamCheck:
  enabled: false
  target: grpc-jvm
  streams: "20"
  ramp: "400 800 1200 1600 2000 2400 2800 3200 3600 4000 4400 4800"
  stepSeconds: "120"
  inflight: "256"
